<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>
    <style>
        /* Reset e estilos globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #111827;
            min-height: 100vh;
        }

        /* Top Bar / Header */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #eaeaea;
            padding: 16px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #000000;
            text-decoration: none;
            white-space: nowrap;
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 0 24px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8e8e93;
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 9px 16px 9px 40px;
            background-color: #f4f4f5;
            border: 1px solid #e4e4e7;
            border-radius: 9999px;
            font-size: 0.95rem;
            color: #18181b;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input::placeholder {
            color: #71717a;
        }

        .search-input:focus {
            background-color: #ffffff;
            border-color: #a1a1aa;
        }

        .cart-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f4f4f5;
            border: 1px solid #e4e4e7;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .cart-button:hover {
            background-color: #e4e4e7;
        }

        .cart-icon {
            width: 18px;
            height: 18px;
            color: #18181b;
        }

        /* Area Principal */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 36px 48px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #000000;
        }

        .product-count {
            font-size: 0.95rem;
            color: #18181b;
            font-weight: 400;
        }

        /* Grid de Produtos e Card */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 260px));
            gap: 20px;
        }

        .product-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 160px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #000000;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1c5335; /* Verde idêntico ao da imagem */
            margin-bottom: 16px;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 10px 14px;
            background-color: #f4f4f5;
            border: 1px solid #e4e4e7;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #000000;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .add-to-cart-btn:hover {
            background-color: #e4e4e7;
        }

        /* Responsividade */
        @media (max-width: 640px) {
            header {
                padding: 12px 16px;
            }

            main {
                padding: 20px 16px;
            }

            .search-container {
                margin: 0 10px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="logo">Minha Loja</a>
        
        <div class="search-container">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" class="search-input" placeholder="Buscar produtos..." id="searchInput">
        </div>

        <button class="cart-button" aria-label="Carrinho">
            <svg class="cart-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
        </button>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <div class="section-header">
            <h1 class="section-title">Todos os Produtos</h1>
            <span class="product-count" id="productCount">1 produtos</span>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Card do Produto -->
            <div class="product-card">
                <div>
                    <h2 class="product-title">Produto Exemplo</h2>
                    <div class="product-price">R$ 25,00</div>
                </div>
                <button class="add-to-cart-btn" onclick="addToCart('Produto Exemplo')">Adicionar ao Carrinho</button>
            </div>
        </div>
    </main>

    <script>
        function addToCart(productName) {
            alert(productName + ' foi adicionado ao carrinho!');
        }
    </script>
</body>
</html>
