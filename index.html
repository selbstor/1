<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELBSTOR | ACHADINHOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #E55A1B;
      --primary-hover: #CC4B12;
      --bg: #FAFAF8;
      --white: #FFFFFF;
      --gray-50: #F7F7F5;
      --gray-100: #EFEFEC;
      --gray-200: #E0DED9;
      --gray-600: #6B6760;
      --text: #1B1B1B;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

    /* LOADING */
    .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* HEADER */
    .header { background: var(--white); border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
    .header-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .header-logo img { max-height: 40px; object-fit: contain; }
    .header-logo span { font-weight: 700; font-size: 1.15rem; color: #1B1B1B; }
    
    .search-bar { flex: 1; max-width: 420px; position: relative; }
    .search-bar input { width: 100%; padding: 10px 16px 10px 38px; border: 1.5px solid var(--gray-200); border-radius: 50px; font-size: 0.88rem; outline: none; background: var(--gray-50); }
    .search-bar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; color: var(--gray-600); }

    .cart-trigger { background: var(--white); border: 1.5px solid var(--gray-200); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
    .cart-trigger svg { width: 20px; height: 20px; }
    
    /* BADGE DO CARRINHO NA BARRA SUPERIOR */
    .cart-badge { 
      position: absolute; 
      top: -4px; 
      right: -4px; 
      background: var(--primary); 
      color: white; 
      font-size: 0.72rem; 
      font-weight: 700; 
      min-width: 18px; 
      height: 18px; 
      padding: 0 4px;
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }

    /* CATEGORIAS */
    .cat-nav { background: var(--white); border-bottom: 1px solid var(--gray-100); overflow-x: auto; }
    .cat-nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 8px; }
    .cat-btn { padding: 12px 16px; font-size: 0.85rem; font-weight: 600; color: var(--gray-600); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
    .cat-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* GRID DE PRODUTOS */
    .main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .section-title { font-size: 1.25rem; font-weight: 700; }
    .product-count { font-size: 0.85rem; color: var(--gray-600); }

    .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .product-card { background: var(--white); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--gray-200); transition: 0.2s; cursor: pointer; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .product-img { aspect-ratio: 1; background: var(--gray-50); overflow: hidden; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 14px 16px; display: flex; flex-direction: column; flex: 1; }
    .product-cat { font-size: 0.72rem; text-transform: uppercase; color: var(--gray-600); font-weight: 600; margin-bottom: 4px; }
    .product-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; flex: 1; }
    .product-price { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    
    /* BOTÃO COMPRAR NOS CARDS (Sempre Laranja Sólido) */
    .btn-buy-card { 
      width: 100% !important; 
      padding: 10px !important; 
      background-color: var(--primary) !important; 
      color: #ffffff !important; 
      border: none !important; 
      border-radius: 8px !important; 
      font-weight: 700 !important; 
      cursor: pointer !important; 
      text-transform: uppercase !important; 
      font-size: 0.82rem !important; 
      letter-spacing: 0.03em !important; 
      display: block !important; 
      margin-top: auto !important;
      transition: background-color 0.2s ease !important;
    }
    .btn-buy-card:hover { 
      background-color: var(--primary-hover) !important; 
    }

    /* MODAL DE PRODUTO */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-product { background: white; border-radius: var(--radius); max-width: 820px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; position: relative; max-height: 90vh; }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gray-200); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 0.9rem; }
    .modal-gallery { background: var(--gray-50); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    .modal-main-img { aspect-ratio: 1; width: 100%; object-fit: cover; }
    .modal-thumbs { display: flex; gap: 8px; padding: 12px; justify-content: center; position: absolute; bottom: 8px; }
    .modal-thumb { width: 44px; height: 44px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: white; }
    .modal-thumb.active { border-color: var(--primary); }
    .modal-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .modal-details { padding: 28px; display: flex; flex-direction: column; overflow-y: auto; }
    .modal-cat { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--primary); margin-bottom: 6px; letter-spacing: 0.05em; }
    .modal-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
    .modal-price { font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
    .modal-desc { font-size: 0.88rem; color: var(--gray-600); margin-bottom: 20px; line-height: 1.5; white-space: pre-line; }
    .option-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: var(--text); }
    .options-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .option-btn { padding: 8px 16px; border: 1px solid var(--gray-200); border-radius: 8px; background: white; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .option-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(229, 90, 27, 0.06); }
    
    .qty-selector { display: flex; align-items: center; border: 1px solid var(--gray-200); border-radius: 8px; width: fit-content; margin-bottom: 20px; overflow: hidden; background: var(--gray-50); }
    .qty-btn { width: 36px; height: 36px; border: none; background: none; cursor: pointer; font-weight: 700; font-size: 1.1rem; }
    .qty-input { width: 40px; text-align: center; border: none; font-weight: 600; outline: none; background: transparent; font-size: 0.95rem; }

    /* BOTÃO ADICIONAR AO CARRINHO NO MODAL */
    .btn-add-modal {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 12px rgba(229, 90, 27, 0.2);
    }
    .btn-add-modal:hover {
      background-color: var(--primary-hover);
    }

    /* TOAST / NOTIFICAÇÃO FLUTUANTE */
    .toast-notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: white;
      border: 1px solid var(--gray-200);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 12px 16px;
      z-index: 400;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast-notification.show {
      transform: translateY(0);
      opacity: 1;
    }
    .toast-img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; }
    .toast-info { display: flex; flex-direction: column; }
    .toast-title { font-weight: 700; font-size: 0.85rem; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast-sub { font-size: 0.75rem; color: var(--gray-600); }
    .toast-btn { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; margin-left: 8px; }
    .toast-btn:hover { background: var(--primary-hover); }

    /* DRAWER DO CARRINHO */
    .cart-drawer { position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100vh; background: white; z-index: 300; box-shadow: -4px 0 24px rgba(0,0,0,0.15); transition: right 0.3s ease; display: flex; flex-direction: column; }
    .cart-drawer.open { right: 0; }
    .drawer-header { padding: 20px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; }
    .drawer-title { font-weight: 700; font-size: 1.1rem; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
    .cart-item-row { display: flex; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--gray-100); padding-bottom: 16px; }
    .cart-item-img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; }
    .cart-item-details { flex: 1; }
    .cart-item-title { font-size: 0.88rem; font-weight: 600; }
    .cart-item-opt { font-size: 0.75rem; color: var(--gray-600); }
    .cart-item-price { font-weight: 700; color: var(--primary); font-size: 0.95rem; margin-top: 4px; }
    .drawer-footer { padding: 20px; border-top: 1px solid var(--gray-200); background: var(--gray-50); }
    .coupon-wrap { display: flex; gap: 8px; margin-bottom: 16px; }
    .coupon-input { flex: 1; padding: 8px 12px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 0.82rem; text-transform: uppercase; }
    .coupon-btn { padding: 8px 16px; background: #1B1B1B; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.82rem; }
    .total-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
    .total-final { font-weight: 700; font-size: 1.1rem; margin-top: 4px; }
    .btn-checkout { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 12px; }

    /* MODAL CHECKOUT */
    .checkout-modal { padding: 24px; max-width: 480px; width: 100%; background: white; border-radius: var(--radius); }
    .checkout-modal input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--gray-200); border-radius: 6px; }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .modal-product { grid-template-columns: 1fr; max-height: 95vh; }
      .cart-drawer { max-width: 100%; }
    }
  </style>
</head>

<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div style="margin-top: 12px; color: var(--gray-600);">Carregando produtos...</div>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-logo" onclick="window.location.reload()">
        <img id="headerLogo" src="" alt="" style="display:none">
        <span id="headerName">SELBSTOR | ACHADINHOS</span>
      </div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar produtos..." oninput="renderProducts()">
      </div>
      <div class="cart-trigger" onclick="toggleCartDrawer(true)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </div>
    </div>
  </header>

  <!-- NAV CATEGORIAS -->
  <nav class="cat-nav">
    <div class="cat-nav-inner" id="catNav"></div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main">
    <div class="section-header">
      <h2 class="section-title" id="sectionTitle">Todos os Produtos</h2>
      <span class="product-count" id="productCount">0 produtos</span>
    </div>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- MODAL DE PRODUTO -->
  <div class="modal-overlay" id="productModal" onclick="if(event.target===this)closeProductModal()">
    <div class="modal-product">
      <button class="modal-close" onclick="closeProductModal()">✕</button>
      <div class="modal-gallery">
        <img class="modal-main-img" id="modalMainImg" src="" alt="">
        <div class="modal-thumbs" id="modalThumbs"></div>
      </div>
      <div class="modal-details">
        <div class="modal-cat" id="modalCat"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-desc" id="modalDesc"></div>
        
        <div id="variationsBlock"></div>

        <div class="option-title">QUANTIDADE</div>
        <div class="qty-selector">
          <button class="qty-btn" onclick="adjustQty(-1)">-</button>
          <input type="text" class="qty-input" id="modalQty" value="1" readonly>
          <button class="qty-btn" onclick="adjustQty(1)">+</button>
        </div>

        <button class="btn-add-modal" onclick="addCurrentToCart()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          Adicionar ao Carrinho
        </button>
        
        <div style="text-align:center; margin-top:14px;">
          <button onclick="shareProduct()" style="background:none; border:none; color:var(--gray-600); cursor:pointer; font-size:0.82rem; display:inline-flex; align-items:center; gap:6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
            Copiar Link do Produto
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION FLUTUANTE -->
  <div class="toast-notification" id="toastNotification">
    <img id="toastImg" src="" class="toast-img">
    <div class="toast-info">
      <div id="toastTitle" class="toast-title">Produto</div>
      <div class="toast-sub" id="toastPrice">Adicionado ao carrinho</div>
    </div>
    <button class="toast-btn" onclick="toggleCartDrawer(true); hideToast();">Ver Carrinho</button>
  </div>

  <!-- DRAWER DO CARRINHO -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Carrinho</div>
      <button onclick="toggleCartDrawer(false)" style="border:none; background:none; font-size:1.2rem; cursor:pointer;">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer">
      <div class="coupon-wrap">
        <input type="text" class="coupon-input" placeholder="CUPOM DE DESCONTO">
        <button class="coupon-btn">Aplicar</button>
      </div>
      <div class="total-row"><span>Subtotal</span><span id="drawerSubtotal">R$ 0,00</span></div>
      <div class="total-row total-final"><span>Total</span><span id="drawerTotal" style="color:var(--primary);">R$ 0,00</span></div>
      <button class="btn-checkout" id="btnFinalizar" onclick="openCheckoutModal()">Finalizar Pedido</button>
    </div>
  </div>

  <!-- MODAL CHECKOUT -->
  <div class="modal-overlay" id="checkoutModal" onclick="if(event.target===this)closeCheckoutModal()">
    <div class="checkout-modal">
      <h3 style="margin-bottom:16px;">Dados para Entrega</h3>
      <input type="text" id="cName" placeholder="Seu Nome Completo *">
      <input type="text" id="cPhone" placeholder="WhatsApp / Telefone *">
      <input type="text" id="cCep" placeholder="CEP">
      <input type="text" id="cAddress" placeholder="Endereço e Número">
      <input type="text" id="cBairro" placeholder="Bairro">
      <input type="text" id="cCity" placeholder="Cidade / UF">
      <button class="btn-checkout" onclick="enviarPedidoFinal()">Confirmar e Enviar Pedido</button>
      <button onclick="closeCheckoutModal()" style="width:100%; margin-top:8px; background:none; border:none; color:var(--gray-600); cursor:pointer;">Voltar ao Carrinho</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymYeLfSeIfuDNdA_29wngSa-90Usr8A5ZuzuNjfbcNzAFer-O2u_aF05rL99poIc1y_A/exec";

    let CONFIG = {};
    let PRODUCTS = [];
    let cart = [];
    let activeCategory = "TODOS";
    let selectedProduct = null;
    let selectedVariation = "";
    let toastTimer = null;

    async function init() {
      try {
        const [resCfg, resProd] = await Promise.all([
          fetch(WEB_APP_URL + '?action=config&_t=' + Date.now()),
          fetch(WEB_APP_URL + '?action=catalogo&_t=' + Date.now())
        ]);
        CONFIG = await resCfg.json();
        PRODUCTS = await resProd.json();

        applyConfig();
        buildCategories();
        renderProducts();
        document.getElementById("loadingScreen").style.display = "none";
      } catch (err) {
        console.error(err);
        document.getElementById("loadingScreen").innerHTML = "Erro ao carregar dados da loja.";
      }
    }

    function applyConfig() {
      document.title = CONFIG.tituloSite || CONFIG.storeName || 'SELBSTOR | ACHADINHOS';
      document.getElementById('headerName').textContent = CONFIG.storeName || 'SELBSTOR | ACHADINHOS';
      if (CONFIG.logo) {
        const logo = document.getElementById('headerLogo');
        logo.src = CONFIG.logo;
        logo.style.display = 'block';
      }
      
      // CONVERSOR INTELIGENTE DE CORES (Lê nomes da planilha e converte para código real)
      if (CONFIG.corPrimaria) {
        let cor = CONFIG.corPrimaria.trim();
        const mapaCores = {
          "laranja": "#E55A1B",
          "azul": "#2563EB",
          "verde": "#16A34A",
          "vermelho": "#DC2626",
          "roxo": "#9333EA",
          "rosa": "#DB2777",
          "dourado": "#D97706",
          "preto": "#1B1B1B",
          "marrom": "#78350F",
          "turquesa": "#0D9488"
        };
        
        let corHex = mapaCores[cor.toLowerCase()] || (cor.startsWith('#') ? cor : '#E55A1B');
        let hoverHex = corHex === '#E55A1B' ? '#CC4B12' : corHex; // fallback hover
        
        document.documentElement.style.setProperty('--primary', corHex);
        document.documentElement.style.setProperty('--primary-hover', hoverHex);
      }
    }

    function getCategories() {
      return ["TODOS", ...new Set(PRODUCTS.map(p => (p.categoria || '').toUpperCase()).filter(Boolean))];
    }

    function buildCategories() {
      const cats = getCategories();
      document.getElementById("catNav").innerHTML = cats.map(c => `
        <button class="cat-btn ${c === activeCategory ? 'active' : ''}" onclick="selectCat('${c}')">${c}</button>
      `).join('');
    }

    function selectCat(cat) {
      activeCategory = cat;
      buildCategories();
      renderProducts();
    }

    function renderProducts() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      let filtered = PRODUCTS;

      if (activeCategory !== "TODOS") {
        filtered = filtered.filter(p => (p.categoria || '').toUpperCase() === activeCategory);
      }
      if (search) {
        filtered = filtered.filter(p => p.nome.toLowerCase().includes(search));
      }

      document.getElementById("productCount").textContent = `${filtered.length} produtos`;
      const grid = document.getElementById("productsGrid");

      if (!filtered.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--gray-600);">Nenhum produto encontrado.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card" onclick="openProductModal(${p.id})">
          <div class="product-img"><img src="${p.img1}" alt="${p.nome}" loading="lazy"></div>
          <div class="product-info">
            <div class="product-cat">${p.categoria}</div>
            <div class="product-name">${p.nome}</div>
            <div class="product-price">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
            <button class="btn-buy-card" onclick="event.stopPropagation(); openProductModal(${p.id})">COMPRAR</button>
          </div>
        </div>
      `).join('');
    }

    function openProductModal(id) {
      selectedProduct = PRODUCTS.find(p => p.id === id);
      if (!selectedProduct) return;

      document.getElementById("modalMainImg").src = selectedProduct.img1;
      document.getElementById("modalCat").textContent = selectedProduct.categoria;
      document.getElementById("modalTitle").textContent = selectedProduct.nome;
      document.getElementById("modalPrice").textContent = `R$ ${selectedProduct.preco.toFixed(2).replace('.', ',')}`;
      document.getElementById("modalDesc").textContent = selectedProduct.descricao;
      document.getElementById("modalQty").value = 1;

      const imgs = [selectedProduct.img1, selectedProduct.img2, selectedProduct.img3, selectedProduct.img4].filter(Boolean);
      document.getElementById("modalThumbs").innerHTML = imgs.length > 1 ? imgs.map((img, i) => `
        <div class="modal-thumb ${i === 0 ? 'active' : ''}" onclick="changeModalImg('${img}', this)"><img src="${img}"></div>
      `).join('') : '';

      const varBlock = document.getElementById("variationsBlock");
      if (selectedProduct.variacoes && selectedProduct.variacoes.length > 0) {
        selectedVariation = selectedProduct.variacoes[0];
        varBlock.innerHTML = `
          <div class="option-title">OPÇÕES</div>
          <div class="options-grid">
            ${selectedProduct.variacoes.map((v, i) => `
              <button class="option-btn ${i === 0 ? 'active' : ''}" onclick="selectVariation('${v}', this)">${v}</button>
            `).join('')}
          </div>
        `;
      } else {
        selectedVariation = "";
        varBlock.innerHTML = "";
      }

      document.getElementById("productModal").classList.add("open");
    }

    function changeModalImg(src, el) {
      document.getElementById("modalMainImg").src = src;
      document.querySelectorAll(".modal-thumb").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
    }

    function selectVariation(v, el) {
      selectedVariation = v;
      document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
    }

    function adjustQty(delta) {
      const input = document.getElementById("modalQty");
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      input.value = val;
    }

    function closeProductModal() {
      document.getElementById("productModal").classList.remove("open");
    }

    function addCurrentToCart() {
      if (!selectedProduct) return;
      const qty = parseInt(document.getElementById("modalQty").value) || 1;
      addToCart(selectedProduct, selectedVariation, qty);
      closeProductModal();
      showToast(selectedProduct);
    }

    function addToCart(product, variation, qty) {
      const existing = cart.find(i => i.id === product.id && i.variation === variation);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({
          id: product.id,
          nome: product.nome,
          preco: product.preco,
          img: product.img1,
          variation: variation,
          qty: qty
        });
      }
      updateCartUI();
    }

    function showToast(product) {
      const toast = document.getElementById("toastNotification");
      document.getElementById("toastImg").src = product.img1;
      document.getElementById("toastTitle").textContent = product.nome;
      document.getElementById("toastPrice").textContent = `Adicionado ao carrinho - R$ ${product.preco.toFixed(2).replace('.', ',')}`;
      
      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        hideToast();
      }, 4000);
    }

    function hideToast() {
      document.getElementById("toastNotification").classList.remove("show");
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
      
      const badge = document.getElementById("cartBadge");
      badge.textContent = totalCount;
      if (totalCount > 0) {
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }

      document.getElementById("btnFinalizar").textContent = `Finalizar Pedido (${totalCount} ${totalCount === 1 ? 'item' : 'itens'})`;

      const body = document.getElementById("drawerBody");
      if (!cart.length) {
        body.innerHTML = `<div style="text-align:center; padding:40px; color:var(--gray-600);">Seu carrinho está vazio.</div>`;
        document.getElementById("drawerSubtotal").textContent = "R$ 0,00";
        document.getElementById("drawerTotal").textContent = "R$ 0,00";
        return;
      }

      body.innerHTML = cart.map((item, idx) => `
        <div class="cart-item-row">
          <img src="${item.img}" class="cart-item-img">
          <div class="cart-item-details">
            <div class="cart-item-title">${item.nome}</div>
            ${item.variation ? `<div class="cart-item-opt">${item.variation}</div>` : ''}
            <div class="cart-item-price">R$ ${item.preco.toFixed(2).replace('.', ',')}</div>
            <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
              <div class="qty-selector" style="margin:0;">
                <button class="qty-btn" onclick="updateCartQty(${idx}, -1)">-</button>
                <input class="qty-input" value="${item.qty}" readonly>
                <button class="qty-btn" onclick="updateCartQty(${idx}, 1)">+</button>
              </div>
              <button onclick="removeFromCart(${idx})" style="border:none; background:none; color:red; cursor:pointer; font-size:0.75rem;">Remover</button>
            </div>
          </div>
        </div>
      `).join('');

      const total = cart.reduce((sum, i) => sum + (i.preco * i.qty), 0);
      document.getElementById("drawerSubtotal").textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
      document.getElementById("drawerTotal").textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function updateCartQty(idx, delta) {
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartUI();
    }

    function removeFrom_Cart(idx) {
      cart.splice(idx, 1);
      updateCartUI();
    }
    
    function removeFromCart(idx) {
      cart.splice(idx, 1);
      updateCartUI();
    }

    function toggleCartDrawer(open) {
      document.getElementById("cartDrawer").classList.toggle("open", open);
    }

    function shareProduct() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href);
        alert("Link do produto copiado com sucesso!");
      } else {
        alert("Copie o link da barra de endereços do seu navegador.");
      }
    }

    function openCheckoutModal() {
      if (!cart.length) { alert("Carrinho vazio!"); return; }
      toggleCartDrawer(false);
      document.getElementById("checkoutModal").classList.add("open");
    }

    function closeCheckoutModal() {
      document.getElementById("checkoutModal").classList.remove("open");
    }

    async function enviarPedidoFinal() {
      const nome = document.getElementById("cName").value.trim();
      const telefone = document.getElementById("cPhone").value.trim();

      if (!nome || !telefone) {
        alert("Preencha Nome e Telefone para continuar.");
        return;
      }

      const total = cart.reduce((sum, i) => sum + (i.preco * i.qty), 0);
      const dados = {
        nome: nome,
        telefone: telefone,
        cep: document.getElementById("cCep").value,
        endereco: document.getElementById("cAddress").value,
        bairro: document.getElementById("cBairro").value,
        cidade: document.getElementById("cCity").value,
        itens: JSON.stringify(cart),
        subtotal: total,
        total: total,
        pagamento: "A Combinar",
        entrega: "Entrega Padrão"
      };

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(dados)
        });
        const r = await res.json();
        if (r.status === "ok") {
          alert("Pedido realizado com sucesso! Nº do pedido: " + r.numeroPedido);
          cart = [];
          updateCartUI();
          closeCheckoutModal();
        } else {
          alert("Erro ao gravar pedido: " + r.mensagem);
        }
      } catch (err) {
        alert("Erro ao enviar pedido.");
      }
    }

    init();
  </script>
</body>
</html>
