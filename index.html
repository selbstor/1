<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Carregando... — Loja Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2A5C3F;
      --primary-rgb: 42, 92, 63;
      --primary-light: rgba(42, 92, 63, 0.08);
      --bg: #FAFAF8;
      --white: #FFFFFF;
      --gray-100: #EFEFEC;
      --gray-200: #E0DED9;
      --gray-600: #6B6760;
      --text: #1B1B1B;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
      --font: 'DM Sans', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; }

    .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .loading-screen.hidden { display: none; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-screen { display: none; max-width: 500px; margin: 80px auto; padding: 40px; text-align: center; background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); }
    .error-screen.show { display: block; }

    .header { background: var(--white); border-bottom: 1px solid var(--gray-200); sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .header-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .header-logo img { max-height: 44px; border-radius: 6px; }

    .search-bar input { padding: 10px 16px; border: 1.5px solid var(--gray-200); border-radius: 50px; outline: none; }
    .cart-btn { background: var(--gray-100); border: none; padding: 10px 16px; border-radius: 50px; font-weight: 600; cursor: pointer; }

    .main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
    .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 20px; }
    .product-card { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); overflow: hidden; padding: 12px; text-align: center; }
    .product-img-wrap { aspect-ratio: 1; overflow: hidden; border-radius: 8px; margin-bottom: 12px; }
    .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .cart-sidebar { position: fixed; top: 0; right: 0; width: 380px; max-width: 100%; height: 100vh; background: var(--white); z-index: 301; padding: 20px; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; box-shadow: var(--shadow-md); }
    .cart-sidebar.open { transform: translateX(0); }
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; display: none; }
    .cart-overlay.open { display: block; }

    .btn-action { width: 100%; padding: 12px; background: var(--primary); color: var(--white); border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; margin-top: auto; }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <p style="margin-top:12px;color:var(--gray-600)">Carregando loja...</p>
  </div>

  <div class="error-screen" id="errorScreen">
    <h2>Ops! Não foi possível carregar a loja</h2>
    <p>Verifique o cadastro da URL da loja ou a publicação no Apps Script.</p>
  </div>

  <header class="header" style="display:none" id="siteHeader">
    <div class="header-inner">
      <div class="header-logo" onclick="window.location.reload()">
        <img id="headerLogo" src="" alt="" style="display:none">
        <span id="headerName" style="font-weight:700;font-size:1.2rem">Loja</span>
      </div>
      <div class="search-bar">
        <input type="text" placeholder="Buscar..." id="searchInput" oninput="renderProducts()">
      </div>
      <button class="cart-btn" onclick="openCart()">🛒 Carrinho (<span id="cartBadge">0</span>)</button>
    </div>
  </header>

  <main class="main" style="display:none" id="mainContent">
    <h2 id="sectionTitle">Produtos</h2>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3>Seu Carrinho</h3>
      <button onclick="closeCart()" style="background:none;border:none;font-size:1.2rem;cursor:pointer">✕</button>
    </div>
    <div id="cartItems" style="flex:1;overflow-y:auto"></div>
    <div style="margin-top:20px;border-top:1px solid var(--gray-200);padding-top:12px">
      <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px">
        <span>Total:</span>
        <span id="cartTotal">R$ 0,00</span>
      </div>
      <button class="btn-action" onclick="enviarPedidoWhatsApp()">Enviar Pedido via WhatsApp</button>
    </div>
  </aside>

  <!-- Apenas o usuarios.js é necessário para carregar a API do Apps Script -->
  <script src="usuarios.js"></script>

  <script>
    let CONFIG = {};
    let PRODUCTS = [];
    let cart = [];
    let LOJA_ATUAL = null;

    async function loadData() {
      LOJA_ATUAL = selbstorBuscarUsuario(window.location.href);
      if (!LOJA_ATUAL || LOJA_ATUAL.vencida) {
        throw new Error("Loja não encontrada ou com licença vencida.");
      }

      const urlLoja = encodeURIComponent(LOJA_ATUAL.url);
      const apiEndpoint = LOJA_ATUAL.apiUrl;

      const [resConfig, resProds] = await Promise.all([
        fetch(`${apiEndpoint}?action=config&url=${urlLoja}`).then(r => r.json()),
        fetch(`${apiEndpoint}?action=produtos&url=${urlLoja}`).then(r => r.json())
      ]);

      if (resConfig.status === 'erro' || resProds.status === 'erro') {
        throw new Error("Falha na resposta do servidor Apps Script.");
      }

      CONFIG = resConfig || {};
      PRODUCTS = Array.isArray(resProds) ? resProds : [];
    }

    function applyConfig() {
      document.title = CONFIG.tituloSite || CONFIG.storeName || 'Loja Online';
      document.getElementById('headerName').textContent = CONFIG.storeName || 'Minha Loja';

      if (CONFIG.corPrimaria) {
        document.documentElement.style.setProperty('--primary', CONFIG.corPrimaria);
      }

      if (CONFIG.logo) {
        const logo = document.getElementById('headerLogo');
        logo.src = CONFIG.logo;
        logo.style.display = 'block';
      }

      document.getElementById('siteHeader').style.display = '';
      document.getElementById('mainContent').style.display = '';
    }

    function renderProducts() {
      const search = (document.getElementById("searchInput").value || "").toLowerCase();
      const filtered = PRODUCTS.filter(p => p.nome.toLowerCase().includes(search));
      const grid = document.getElementById("productsGrid");

      if (!filtered.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center">Nenhum produto encontrado.</p>';
        return;
      }

      grid.innerHTML = filtered.map((p, idx) => `
        <div class="product-card">
          <div class="product-img-wrap">
            <img src="${p.img1 || 'https://via.placeholder.com/300'}" alt="${p.nome}">
          </div>
          <strong style="display:block;margin-bottom:6px">${p.nome}</strong>
          <div style="color:var(--primary);font-weight:700;margin-bottom:12px">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
          <button class="btn-action" onclick="addToCart(${idx})">Adicionar</button>
        </div>
      `).join('');
    }

    function addToCart(idx) {
      const p = PRODUCTS[idx];
      const exist = cart.find(item => item.nome === p.nome);
      if (exist) { exist.qty++; }
      else { cart.push({ nome: p.nome, preco: p.preco, qty: 1 }); }
      renderCart();
      openCart();
    }

    function renderCart() {
      const totalQty = cart.reduce((s, i) => s + i.qty, 0);
      const totalPrice = cart.reduce((s, i) => s + (i.preco * i.qty), 0);

      document.getElementById("cartBadge").textContent = totalQty;
      document.getElementById("cartTotal").textContent = `R$ ${totalPrice.toFixed(2).replace('.', ',')}`;

      const container = document.getElementById("cartItems");
      if (!cart.length) {
        container.innerHTML = '<p style="text-align:center;color:var(--gray-600);margin-top:40px">Carrinho vazio.</p>';
        return;
      }

      container.innerHTML = cart.map((i, index) => `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--gray-100);padding-bottom:8px">
          <div>
            <strong>${i.nome}</strong><br>
            <small style="color:var(--gray-600)">${i.qty}x R$ ${i.preco.toFixed(2).replace('.', ',')}</small>
          </div>
          <button onclick="cart.splice(${index},1);renderCart();" style="color:#dc2626;background:none;border:none;cursor:pointer;font-weight:600">Remover</button>
        </div>
      `).join('');
    }

    function openCart() {
      document.getElementById("cartOverlay").classList.add("open");
      document.getElementById("cartSidebar").classList.add("open");
    }

    function closeCart() {
      document.getElementById("cartOverlay").classList.remove("open");
      document.getElementById("cartSidebar").classList.remove("open");
    }

    async function enviarPedidoWhatsApp() {
      if (!cart.length) return;

      const total = cart.reduce((s, i) => s + (i.preco * i.qty), 0);
      const payload = {
        urlLoja: LOJA_ATUAL.url,
        nome: "Cliente Web",
        telefone: "",
        itens: cart.map(i => `${i.qty}x ${i.nome}`).join(' | '),
        subtotal: `R$ ${total.toFixed(2).replace('.', ',')}`,
        total: `R$ ${total.toFixed(2).replace('.', ',')}`
      };

      try {
        await fetch(LOJA_ATUAL.apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Erro ao gravar pedido:", e);
      }

      let msg = `*Novo Pedido - ${CONFIG.storeName || 'Loja'}*\n\n`;
      cart.forEach(i => { msg += `${i.qty}x ${i.nome} - R$ ${(i.preco * i.qty).toFixed(2)}\n`; });
      msg += `\n*Total: R$ ${total.toFixed(2)}*`;

      const destNum = CONFIG.whatsapp || '5500000000000';
      window.open(`https://wa.me/${destNum}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function init() {
      try {
        await loadData();
        applyConfig();
        renderProducts();
        document.getElementById("loadingScreen").classList.add("hidden");
      } catch (err) {
        console.error(err);
        document.getElementById("loadingScreen").style.display = "none";
        document.getElementById("errorScreen").classList.add("show");
      }
    }

    init();
  </script>
</body>

</html>
