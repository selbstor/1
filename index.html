<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>LojaFácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       CSS VARIABLES & BASE STYLES
       ============================================ */
    :root {
      --primary: #2A5C3F;
      --primary-rgb: 42, 92, 63;
      --primary-light: rgba(42, 92, 63, 0.08);
      --primary-hover: #1E4530;
      --secondary: #1B1B1B;
      --secondary-hover: #000000;
      --secondary-light: rgba(27, 27, 27, 0.08);
      --bg: #FAFAF8;
      --white: #FFFFFF;
      --gray-50: #F7F7F5;
      --gray-100: #EFEFEC;
      --gray-200: #E0DED9;
      --gray-300: #C8C5BE;
      --gray-400: #A8A49C;
      --gray-500: #87837A;
      --gray-600: #6B6760;
      --gray-700: #4A4740;
      --gray-800: #2D2B27;
      --text: #1B1B1B;
      --text-muted: #6B6760;
      --text-light: #87837A;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.12);
      --transition: 0.2s ease;
      --font: 'DM Sans', -apple-system, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { overflow-x: hidden; max-width: 100vw; }
    body.modal-open { position: fixed; width: 100%; height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; display: block; }
    button { cursor: pointer; font-family: var(--font); border: none; }
    input, select, textarea { font-family: var(--font); }
    a { color: inherit; text-decoration: none; }

    /* LOADING & ERROR */
    .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease; }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 16px; font-size: 0.9rem; color: var(--text-muted); }
    
    .error-screen { display: none; max-width: 500px; margin: 80px auto; padding: 40px; text-align: center; background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); }
    .error-screen.show { display: block; }

    .top-bar { background: var(--primary); color: var(--white); text-align: center; padding: 8px 20px; font-size: 0.82rem; font-weight: 500; display: none; }
    .top-bar.show { display: block; }

    /* HEADER */
    .header { background: var(--white); border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
    .header-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .header-logo img { max-height: 44px; max-width: 160px; width: auto; height: auto; border-radius: 6px; object-fit: contain; }
    .header-logo span { font-weight: 700; font-size: 1.15rem; color: #1B1B1B; letter-spacing: -0.02em; }
    
    .search-bar { flex: 1; max-width: 420px; position: relative; }
    .search-bar input { width: 100%; padding: 10px 36px 10px 42px; border: 1.5px solid var(--gray-200); border-radius: 50px; font-size: 0.9rem; background: var(--gray-50); outline: none; transition: var(--transition); }
    .search-bar input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px var(--primary-light); }
    .search-bar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray-400); width: 18px; height: 18px; }
    .search-clear { display: none !important; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: var(--gray-200); border: none; width: 20px; height: 20px; border-radius: 50%; font-size: 0.7rem; color: var(--gray-600); cursor: pointer; align-items: center; justify-content: center; }
    .search-clear.show { display: flex !important; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .cart-btn { position: relative; background: var(--gray-50); border: 1.5px solid var(--gray-200); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gray-700); }
    .cart-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .cart-btn svg { width: 20px; height: 20px; }
    .cart-badge { position: absolute; top: -4px; right: -4px; background: var(--primary); color: var(--white); font-size: 0.7rem; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: none; align-items: center; justify-content: center; border: 2px solid var(--white); }
    .cart-badge.show { display: flex; }

    /* NAV & CATEGORIES */
    .cat-nav { background: var(--white); border-bottom: 1px solid var(--gray-100); position: relative; }
    .cat-nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .cat-nav-inner::-webkit-scrollbar { display: none; }
    .cat-btn { padding: 12px 18px; font-size: 0.88rem; font-weight: 700; color: var(--text-muted); background: none; white-space: nowrap; border-bottom: 2px solid transparent; transition: var(--transition); }
    .cat-btn:hover { color: var(--text); }
    .cat-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .subcat-bar { max-width: 1200px; margin: 0 auto; padding: 16px 20px 0; display: none; gap: 8px; flex-wrap: wrap; }
    .subcat-bar.show { display: flex; }
    .subcat-btn { padding: 7px 16px; font-size: 0.82rem; font-weight: 500; background: var(--white); border: 1.5px solid var(--gray-200); border-radius: 50px; color: var(--text-muted); transition: var(--transition); }
    .subcat-btn.active { background: var(--primary); border-color: var(--primary); color: var(--white); }

    /* BANNER & MAIN */
    .banner { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: none; }
    .banner.show { display: block; }
    .banner-img { width: 100%; height: 260px; object-fit: cover; border-radius: var(--radius-lg); }

    .main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
    .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
    .section-title { font-size: 1.3rem; font-weight: 700; color: var(--secondary); }
    .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }

    .product-card { background: var(--white); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--gray-100); transition: var(--transition); cursor: pointer; }
    .product-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .product-img-wrap { position: relative; aspect-ratio: 1; background: var(--gray-50); }
    .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 14px 16px 16px; }
    .product-name { font-size: 0.95rem; font-weight: 600; color: var(--secondary); margin-bottom: 8px; }
    .product-price { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
    .price-current { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    .btn-details { width: 100%; padding: 10px; background: var(--gray-50); border: 1.5px solid var(--gray-200); border-radius: var(--radius); font-size: 0.85rem; font-weight: 600; }
    .btn-details:hover { background: var(--primary); border-color: var(--primary); color: var(--white); }

    /* MODAL PRODUCT & CART */
    .modal-overlay, .cart-overlay, .checkout-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open, .cart-overlay.open, .checkout-overlay.open { display: flex; }
    
    .modal { background: var(--white); border-radius: var(--radius-lg); max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: var(--white); border: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: center; z-index: 10; }

    .cart-sidebar { position: fixed; top: 0; right: 0; width: 420px; max-width: 100%; height: 100vh; background: var(--white); z-index: 301; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.35s ease; }
    .cart-sidebar.open { transform: translateX(0); }
    .cart-header { padding: 20px 24px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; }
    .cart-items { flex: 1; overflow-y: auto; padding: 16px 24px; }
    .cart-footer { padding: 20px 24px; border-top: 1px solid var(--gray-100); background: var(--gray-50); }

    /* CHECKOUT MODAL & FORM STYLES */
    .checkout-modal { background: var(--white); border-radius: var(--radius-lg); max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }
    .checkout-header { padding: 20px 24px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; }
    .checkout-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
    .checkout-footer { padding: 16px 24px; border-top: 1px solid var(--gray-100); background: var(--white); }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); font-size: 0.9rem; color: var(--text); background: var(--white); outline: none; transition: var(--transition); }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-option { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); cursor: pointer; transition: var(--transition); }
    .radio-option:hover { border-color: var(--primary); }
    .radio-option.selected { border-color: var(--primary); background: var(--primary-light); }
    .radio-option-price { margin-left: auto; font-size: 0.82rem; color: var(--text-light); font-weight: 500; }

    .checkout-summary { background: var(--gray-50); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
    .checkout-summary h3 { font-size: 0.88rem; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; }
    .checkout-item { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }

    .btn-whatsapp { width: 100%; padding: 15px; background: #25D366; color: var(--white); border-radius: var(--radius); font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; transition: var(--transition); }
    .btn-whatsapp:hover { background: #20BD5A; }

    /* CONFIRMED MODAL */
    .order-confirmed-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
    .order-confirmed-overlay.open { display: flex; }
    .order-confirmed-box { background: var(--white); border-radius: var(--radius-lg); padding: 36px 28px; text-align: center; max-width: 400px; width: 100%; position: relative; }
    .order-confirmed-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }

    /* FOOTER */
    .footer { background: #1B1B1B; color: rgba(255,255,255,0.5); padding: 36px 20px; text-align: center; margin-top: 40px; }
    .footer-name { font-size: 1rem; font-weight: 600; color: #FFFFFF; margin-bottom: 12px; }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .cart-sidebar { width: 100%; }
      .checkout-overlay { padding: 0; }
      .checkout-modal { max-width: 100vw; height: 100vh; border-radius: 0; }
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando loja...</div>
  </div>

  <!-- Error -->
  <div class="error-screen" id="errorScreen">
    <h2>Ops! Não foi possível carregar a loja</h2>
    <p>Verifique a sua conexão ou tente novamente em instantes.</p>
  </div>

  <div class='top-bar' id='topBar'></div>

  <!-- Header -->
  <header class="header" style="display:none" id="siteHeader">
    <div class="header-inner">
      <div class="header-logo" onclick="window.location.reload()" style="cursor:pointer">
        <img id="headerLogo" src="" alt="Logo" style="display:none">
        <span id="headerName"></span>
      </div>
      <div class="search-bar" id="searchBar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        <input type="text" placeholder="Buscar produtos..." id="searchInput" oninput='filterProducts()'>
      </div>
      <div class="header-actions">
        <button class="cart-btn" onclick="openCart()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
          </svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="cat-nav" style="display:none" id="catNavWrap">
    <div class="cat-nav-inner" id="catNav"></div>
  </nav>

  <div class="subcat-bar" id="subcatBar"></div>
  <section class="banner" id="bannerSection"></section>

  <main class="main" style="display:none" id="mainContent">
    <div class="section-header">
      <h2 class="section-title" id="sectionTitle">Todos os Produtos</h2>
      <span class="product-count" id="productCount"></span>
    </div>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Cart Sidebar -->
  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3 class="cart-title">Carrinho</h3>
      <button class="cart-close" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartFooter">
      <div class="cart-totals">
        <div class="cart-total-row total" style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:700;">
          <span>Total</span>
          <span id="cartTotal">R$ 0,00</span>
        </div>
      </div>
      <button class="btn-checkout" style="width:100%; padding:12px; background:var(--primary); color:white; border-radius:var(--radius); font-weight:700;" onclick="openCheckout()">Finalizar Pedido</button>
    </div>
  </aside>

  <!-- Checkout Modal -->
  <div class="checkout-overlay" id="checkoutOverlay">
    <div class="checkout-modal">
      <div class="checkout-header">
        <h2>Finalizar Pedido</h2>
        <button class="modal-close" onclick="closeCheckout()">✕</button>
      </div>
      <div class="checkout-body">
        
        <!-- Telefone -->
        <div class="form-group">
          <label>Telefone *</label>
          <input type='tel' id='custPhone' placeholder='99999-9999' maxlength='15' oninput='maskPhone(this); onPhoneChange(this.value);'>
        </div>

        <!-- Nome -->
        <div class="form-group">
          <label>NOME *</label>
          <input type="text" id="custName">
        </div>

        <!-- Grupo de Endereço -->
        <div id='addressGroup' style='display:none'>
          <!-- CEP Oculto conforme solicitação -->
          <div class='form-group' style='display:none'>
            <label>CEP</label>
            <input type='text' id='custCep'>
          </div>

          <div class='form-group'>
            <label>Endereço *</label>
            <input type='text' id='custEndereco' placeholder='Rua das Flores'>
          </div>

          <div class='form-group'>
            <label>Complemento</label>
            <input type='text' id='custComplemento'>
          </div>

          <div style='display:grid; grid-template-columns:1fr 1fr; gap:12px'>
            <div class='form-group'>
              <label>Bairro *</label>
              <input type='text' id='custBairro' oninput='onAddressChange()' onblur='onAddressChange()'>
            </div>
            <div class='form-group'>
              <label>CIDADE *</label>
              <input type='text' id='custCidade' oninput='onAddressChange()' onblur='onAddressChange()'>
            </div>
          </div>
        </div>

        <!-- Forma de Pagamento -->
        <div class="form-group">
          <label>Forma de Pagamento *</label>
          <select id="paymentMethod">
            <option value="">Selecione...</option>
            <option value="Pix">Pix</option>
            <option value="Cartão de Crédito">Cartão de Crédito</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>

        <!-- Opção de Entrega (Antes de Observações) -->
        <div class="form-group">
          <label>Opção de Entrega *</label>
          <div class="radio-group" id="deliveryOptions"></div>
        </div>

        <!-- Observações -->
        <div class="form-group">
          <label>Observações</label>
          <textarea id="custObs" placeholder=""></textarea>
        </div>

        <div class="checkout-summary" id="checkoutSummary"></div>
      </div>

      <div class="checkout-footer">
        <button class="btn-whatsapp" id="btnEnviarPedido" onclick="sendOrder()">
          <span id="btnEnviarPedidoTexto">Enviar Pedido</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Order Confirmed Modal -->
  <div class='order-confirmed-overlay' id='orderConfirmed'>
    <div class='order-confirmed-box'>
      <button onclick='closeOrderConfirmed()' style='position:absolute; top:12px; right:12px; background:none; border:none; cursor:pointer;'>✕</button>
      <div class='order-confirmed-title'>Pedido Recebido!</div>
      <div class='order-confirmed-text' id='orderConfirmedText' style='font-size:0.9rem; color:var(--text-muted); margin-bottom:16px;'>Seu pedido foi registrado com sucesso! Obrigado pela preferência.</div>
      <button onclick='closeOrderConfirmed()' style='padding:10px 24px; background:var(--primary); color:white; border-radius:var(--radius); font-weight:600;'>OK</button>
    </div>
  </div>

  <!-- Config (External File) -->
  <script src="config.js"></script>

  <script>
    // ============================================
    // STATE & INITIALIZATION
    // ============================================
    let CONFIG = {};
    let PRODUCTS = [];
    let CLIENTES = {};
    let DELIVERY_AREAS = [];
    let cart = [];
    let selectedDeliveryType = null; // 'Retirada' ou 'Delivery'

    function parsePrecoBR(val) {
      if (!val) return 0;
      if (typeof val === 'number') return val;
      let clean = val.replace(/[^\d,. ]/g, '').trim().replace(',', '.');
      return parseFloat(clean) || 0;
    }

    function formatCurrency(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function maskPhone(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length > 11) v = v.substring(0, 11);
      if (v.length > 10) {
        input.value = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      } else if (v.length > 6) {
        input.value = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
      } else if (v.length > 2) {
        input.value = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
      } else {
        input.value = v;
      }
    }

    // ============================================
    // LOADERS & DATA
    // ============================================
    async function initApp() {
      try {
        if (typeof LOJAFACIL !== 'undefined') {
          if (LOJAFACIL.planilha_configuracoes) await loadConfig();
          if (LOJAFACIL.planilha_produtos) await loadProducts();
          if (LOJAFACIL.planilha_clientes) await loadClientes();
          if (LOJAFACIL.planilha_delivery) await loadDeliveryAreas();
        }
        
        applyConfig();
        renderProducts(PRODUCTS);
        
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('siteHeader').style.display = 'block';
        document.getElementById('mainContent').style.display = 'block';
      } catch (err) {
        console.error("Erro ao carregar app:", err);
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('errorScreen').classList.add('show');
      }
    }

    async function loadConfig() {
      // Mock / Config loader fallback
      CONFIG = {
        storeName: "Minha Loja",
        enviarWhatsapp: true,
        delivery: true,
        retiradaLocal: true,
        taxaDelivery: null // Se nulo/vazio, busca na aba Delivery
      };
    }

    async function loadProducts() {
      // Exemplo básico caso a planilha falhe
      PRODUCTS = PRODUCTS.length ? PRODUCTS : [
        { nome: "Produto Exemplo", preco: 25.00, descricao: "Descrição do produto exemplo" }
      ];
    }

    async function loadClientes() { CLIENTES = CLIENTES || {}; }
    async function loadDeliveryAreas() { DELIVERY_AREAS = DELIVERY_AREAS || []; }

    function applyConfig() {
      document.getElementById('headerName').textContent = CONFIG.storeName || "LojaFácil";
    }

    // ============================================
    // RENDER PRODUCTS & CART
    // ============================================
    function renderProducts(list) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = list.map((p, idx) => `
        <div class="product-card" onclick="addToCartIdx(${idx})">
          <div class="product-info">
            <div class="product-name">${p.nome}</div>
            <div class="product-price"><span class="price-current">${formatCurrency(p.preco)}</span></div>
            <button class="btn-details">Adicionar ao Carrinho</button>
          </div>
        </div>
      `).join('');
      document.getElementById('productCount').textContent = `${list.length} produtos`;
    }

    function addToCartIdx(idx) {
      const prod = PRODUCTS[idx];
      cart.push(prod);
      updateCartUI();
      openCart();
    }

    function updateCartUI() {
      document.getElementById('cartBadge').textContent = cart.length;
      document.getElementById('cartBadge').classList.toggle('show', cart.length > 0);
      
      const itemsContainer = document.getElementById('cartItems');
      if (!cart.length) {
        itemsContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-light)">Carrinho vazio</div>`;
        document.getElementById('cartTotal').textContent = formatCurrency(0);
        return;
      }

      let total = 0;
      itemsContainer.innerHTML = cart.map((item, i) => {
        total += item.preco;
        return `
          <div style="display:flex; justify-size:space-between; align-items:center; margin-bottom:12px;">
            <div>
              <div style="font-weight:600">${item.nome}</div>
              <div style="font-size:0.85rem; color:var(--primary); font-weight:700">${formatCurrency(item.preco)}</div>
            </div>
            <button onclick="removeFromCart(${i})" style="color:red; background:none; margin-left:auto;">Remover</button>
          </div>
        `;
      }).join('');

      document.getElementById('cartTotal').textContent = formatCurrency(total);
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function openCart() {
      document.getElementById('cartOverlay').classList.add('open');
      document.getElementById('cartSidebar').classList.add('open');
    }

    function closeCart() {
      document.getElementById('cartOverlay').classList.remove('open');
      document.getElementById('cartSidebar').classList.remove('open');
    }

    // ============================================
    // CHECKOUT LOGIC & CALCULATIONS
    // ============================================
    
    // Requisito 3: Limpar todos os dados do formulário ao abrir
    function openCheckout() {
      closeCart();
      
      // Reseta todos os campos do cliente
      document.getElementById('custPhone').value = '';
      document.getElementById('custName').value = '';
      document.getElementById('custEndereco').value = '';
      document.getElementById('custComplemento').value = '';
      document.getElementById('custBairro').value = '';
      document.getElementById('custCidade').value = '';
      document.getElementById('custObs').value = '';
      document.getElementById('paymentMethod').value = '';

      // Oculta o grupo de endereço
      document.getElementById('addressGroup').style.display = 'none';
      selectedDeliveryType = null;

      renderDeliveryOptions();
      buildCheckoutSummary();

      document.getElementById('checkoutOverlay').classList.add('open');
    }

    function closeCheckout() {
      document.getElementById('checkoutOverlay').classList.remove('open');
    }

    // Requisito 1: Ao limpar telefone, limpa demais campos e só mostra ao digitar novamente
    function onPhoneChange(phoneVal) {
      const rawPhone = phoneVal.replace(/\D/g, '');
      const addressGroup = document.getElementById('addressGroup');

      if (!rawPhone || rawPhone.length < 8) {
        // Limpa e oculta
        document.getElementById('custName').value = '';
        document.getElementById('custEndereco').value = '';
        document.getElementById('custComplemento').value = '';
        document.getElementById('custBairro').value = '';
        document.getElementById('custCidade').value = '';
        addressGroup.style.display = 'none';
      } else {
        // Exibe grupo de endereço
        addressGroup.style.display = 'block';

        // Busca cliente se cadastrado
        if (CLIENTES[rawPhone]) {
          const cli = CLIENTES[rawPhone];
          document.getElementById('custName').value = cli.nome || '';
          document.getElementById('custEndereco').value = cli.endereco || '';
          document.getElementById('custComplemento').value = cli.complemento || '';
          document.getElementById('custBairro').value = cli.bairro || '';
          document.getElementById('custCidade').value = cli.cidade || '';
        }
      }

      onAddressChange();
    }

    // Requisito 5: Recalcula delivery ao alterar bairro ou cidade
    function onAddressChange() {
      renderDeliveryOptions();
      buildCheckoutSummary();
    }

    // Requisitos 2 e 4: Cálculo da Taxa de Delivery
    function getTaxaDeliveryAtual() {
      if (selectedDeliveryType !== 'Delivery') return 0;

      // 1. Verifica se existe taxa em Configurações
      if (CONFIG.taxaDelivery !== null && CONFIG.taxaDelivery !== undefined && CONFIG.taxaDelivery > 0) {
        return Number(CONFIG.taxaDelivery);
      }

      // 2. Se não existir, busca na aba Delivery pelo Bairro ou Cidade
      const bairro = (document.getElementById('custBairro').value || '').trim().toLowerCase();
      const cidade = (document.getElementById('custCidade').value || '').trim().toLowerCase();

      if (DELIVERY_AREAS && DELIVERY_AREAS.length > 0) {
        const matchArea = DELIVERY_AREAS.find(a => 
          (bairro && a.bairro && a.bairro.toLowerCase() === bairro) ||
          (cidade && a.cidade && a.cidade.toLowerCase() === cidade)
        );

        if (matchArea) return matchArea.taxa;
      }

      return 0; // Padrão se não encontrar área correspondente
    }

    // Requisito 3 e 7: Renderiza opções de entrega e exibe a taxa apenas quando Delivery for selecionado
    function renderDeliveryOptions() {
      const container = document.getElementById('deliveryOptions');
      let html = '';

      if (CONFIG.retiradaLocal) {
        const isSel = selectedDeliveryType === 'Retirada';
        html += `
          <label class="radio-option ${isSel ? 'selected' : ''}" onclick="selectDelivery('Retirada')">
            <input type="radio" name="delOption" ${isSel ? 'checked' : ''}>
            <span class="radio-option-text">Retirada no Local</span>
            <span class="radio-option-price">Grátis</span>
          </label>
        `;
      }

      if (CONFIG.delivery) {
        const isSel = selectedDeliveryType === 'Delivery';
        let taxaLabel = '';

        // Requisito 7: Só mostra o valor da taxa de delivery após a opção ser escolhida
        if (isSel) {
          const taxa = getTaxaDeliveryAtual();
          taxaLabel = taxa > 0 ? formatCurrency(taxa) : 'Grátis';
        }

        html += `
          <label class="radio-option ${isSel ? 'selected' : ''}" onclick="selectDelivery('Delivery')">
            <input type="radio" name="delOption" ${isSel ? 'checked' : ''}>
            <span class="radio-option-text">Delivery</span>
            <span class="radio-option-price">${taxaLabel}</span>
          </label>
        `;
      }

      container.innerHTML = html;
    }

    function selectDelivery(type) {
      selectedDeliveryType = type;
      renderDeliveryOptions();
      buildCheckoutSummary();
    }

    function buildCheckoutSummary() {
      const summary = document.getElementById('checkoutSummary');
      let subtotal = cart.reduce((acc, item) => acc + item.preco, 0);
      let taxa = getTaxaDeliveryAtual();
      let total = subtotal + taxa;

      summary.innerHTML = `
        <h3>Resumo do Pedido</h3>
        <div class="checkout-item"><span>Subtotal</span><span>${formatCurrency(subtotal)}</span></div>
        ${selectedDeliveryType === 'Delivery' ? `<div class="checkout-item"><span>Taxa de Entrega</span><span>${taxa > 0 ? formatCurrency(taxa) : 'Grátis'}</span></div>` : ''}
        <div class="checkout-item" style="font-weight:700; color:var(--text); margin-top:8px; font-size:0.95rem;">
          <span>Total</span><span>${formatCurrency(total)}</span>
        </div>
      `;
    }

    // Requisito 6: Envio do Pedido no Browser / Tratamento WhatsApp "Não"
    function sendOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const pay = document.getElementById('paymentMethod').value;

      if (!phone || !name) {
        alert("Por favor, preencha o Telefone e o NOME.");
        return;
      }

      if (!selectedDeliveryType) {
        alert("Por favor, selecione uma Opção de Entrega.");
        return;
      }

      if (!pay) {
        alert("Por favor, selecione uma Forma de Pagamento.");
        return;
      }

      // Se Enviar WhatsApp estiver ativo
      if (CONFIG.enviarWhatsapp && CONFIG.whatsapp) {
        let msg = `*Novo Pedido - ${CONFIG.storeName}*\n\n`;
        msg += `*Nome:* ${name}\n`;
        msg += `*Telefone:* ${phone}\n`;
        msg += `*Entrega:* ${selectedDeliveryType}\n`;
        msg += `*Pagamento:* ${pay}\n\n`;
        msg += `*Itens:*\n` + cart.map(i => `- ${i.nome} (${formatCurrency(i.preco)})`).join('\n');
        
        const url = `https://wa.me/${CONFIG.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
      }

      // Exibe a tela de confirmação do pedido
      closeCheckout();
      cart = [];
      updateCartUI();
      document.getElementById('orderConfirmed').classList.add('open');
    }

    function closeOrderConfirmed() {
      document.getElementById('orderConfirmed').classList.remove('open');
    }

    function filterProducts() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = PRODUCTS.filter(p => p.nome.toLowerCase().includes(term));
      renderProducts(filtered);
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
