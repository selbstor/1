<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregando... — Loja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2A5C3F;
      --primary-hover: #1E4530;
      --secondary: #1B1B1B;
      --bg: #FAFAF8;
      --white: #FFFFFF;
      --gray-50: #F7F7F5;
      --gray-200: #E0DED9;
      --gray-600: #6B6760;
      --text: #1B1B1B;
      --radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .header { background: var(--white); border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
    .header-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .header-logo img { max-height: 44px; object-fit: contain; }
    .header-logo span { font-weight: 700; font-size: 1.15rem; color: #1B1B1B; }
    
    .search-bar { flex: 1; max-width: 420px; position: relative; }
    .search-bar input { width: 100%; padding: 10px 16px 10px 40px; border: 1.5px solid var(--gray-200); border-radius: 50px; font-size: 0.9rem; outline: none; background: var(--gray-50); }
    
    .cart-btn { position: relative; background: var(--white); border: 1.5px solid var(--gray-200); padding: 8px 14px; border-radius: 50px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .cart-badge { background: #E53E3E; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50px; position: absolute; top: -6px; right: -6px; font-weight: 700; }

    .main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
    .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .product-card { background: var(--white); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--gray-200); transition: 0.2s; cursor: pointer; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .product-img { aspect-ratio: 1; background: var(--gray-50); overflow: hidden; }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 14px 16px; display: flex; flex-direction: column; flex: 1; }
    .product-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; }
    .product-price { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .btn-buy { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: auto; transition: 0.2s; }
    .btn-buy:hover { background: var(--primary-hover); }

    /* Modal Carrinho */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: var(--radius); max-width: 500px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 16px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--gray-200); padding-bottom: 8px; }
    .checkout-form input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--gray-200); border-radius: 6px; }
    @media(max-width: 768px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div style="margin-top: 12px; color: var(--gray-600);">Carregando loja...</div>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="header-logo" onclick="window.location.reload()">
        <img id="headerLogo" src="" alt="" style="display:none">
        <span id="headerName">Loja</span>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar produtos..." oninput="renderProducts()">
      </div>
      <button class="cart-btn" onclick="openCartModal()">
        🛒 <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="main">
    <h2 id="sectionTitle" style="margin-bottom: 20px;">Todos os Produtos</h2>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Modal do Carrinho / Checkout -->
  <div class="modal-overlay" id="cartModal" onclick="if(event.target===this)closeCartModal()">
    <div class="modal">
      <h3>Seu Carrinho</h3>
      <div id="cartItemsList"></div>
      <div id="cartTotal" style="font-weight:700; margin: 16px 0; font-size: 1.1rem;"></div>
      
      <div class="checkout-form" id="checkoutForm" style="display:none;">
        <h4 style="margin-bottom: 10px;">Dados para Entrega</h4>
        <input type="text" id="clientName" placeholder="Seu Nome Completo *">
        <input type="text" id="clientPhone" placeholder="WhatsApp / Telefone *">
        <input type="text" id="clientCep" placeholder="CEP">
        <input type="text" id="clientAddress" placeholder="Endereço (Rua, Número)">
        <input type="text" id="clientBairro" placeholder="Bairro">
        <input type="text" id="clientCity" placeholder="Cidade / UF">
        <button class="btn-buy" onclick="enviarPedido()">Finalizar Pedido via WhatsApp / Sistema</button>
      </div>

      <button class="btn-buy" id="btnProceedCheckout" onclick="showCheckoutForm()" style="background:#25D366;">Continuar para Entrega</button>
      <button onclick="closeCartModal()" style="width:100%; margin-top:8px; background:none; border:none; color:var(--gray-600); cursor:pointer;">Continuar Comprando</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymYeLfSeIfuDNdA_29wngSa-90Usr8A5ZuzuNjfbcNzAFer-O2u_aF05rL99poIc1y_A/exec";

    let CONFIG = {};
    let PRODUCTS = [];
    let cart = [];

    async function init() {
      try {
        const [resCfg, resProd] = await Promise.all([
          fetch(WEB_APP_URL + '?action=config&_t=' + Date.now()),
          fetch(WEB_APP_URL + '?action=catalogo&_t=' + Date.now())
        ]);
        CONFIG = await resCfg.json();
        PRODUCTS = await resProd.json();
        
        applyConfig();
        renderProducts();
        document.getElementById("loadingScreen").style.display = "none";
      } catch (err) {
        console.error(err);
        document.getElementById("loadingScreen").innerHTML = "Erro ao carregar a loja. Verifique o Web App.";
      }
    }

    function applyConfig() {
      document.title = CONFIG.tituloSite || CONFIG.storeName || 'Loja';
      document.getElementById('headerName').textContent = CONFIG.storeName || 'Loja';
      if (CONFIG.logo) {
        const logo = document.getElementById('headerLogo');
        logo.src = CONFIG.logo;
        logo.style.display = 'block';
      }
      if (CONFIG.corPrimaria) {
        document.documentElement.style.setProperty('--primary', CONFIG.corPrimaria);
      }
    }

    function renderProducts() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filtered = PRODUCTS.filter(p => p.nome.toLowerCase().includes(search));
      const grid = document.getElementById("productsGrid");

      if (!filtered.length) {
        grid.innerHTML = "<p>Nenhum produto encontrado.</p>";
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-img"><img src="${p.img1 || 'https://via.placeholder.com/300'}" alt="${p.nome}"></div>
          <div class="product-info">
            <div class="product-name">${p.nome}</div>
            <div class="product-price">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
            <button class="btn-buy" onclick="addToCart(${p.id})">COMPRAR</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = PRODUCTS.find(p => p.id === id);
      if (!product) return;
      cart.push(product);
      updateCartCount();
      alert(`"${product.nome}" foi adicionado ao carrinho!`);
    }

    function updateCartCount() {
      document.getElementById("cartCount").textContent = cart.length;
    }

    function openCartModal() {
      const list = document.getElementById("cartItemsList");
      if (!cart.length) {
        list.innerHTML = "<p>Seu carrinho está vazio.</p>";
        document.getElementById("cartTotal").textContent = "";
        document.getElementById("checkoutForm").style.display = "none";
        document.getElementById("btnProceedCheckout").style.display = "none";
      } else {
        list.innerHTML = cart.map((item, idx) => `
          <div class="cart-item">
            <span>${item.nome}</span>
            <span>R$ ${item.preco.toFixed(2).replace('.', ',')} <button onclick="removeFromCart(${idx})" style="border:none;background:none;color:red;cursor:pointer;margin-left:8px;">✕</button></span>
          </div>
        `).join('');
        const total = cart.reduce((sum, i) => sum + i.preco, 0);
        document.getElementById("cartTotal").textContent = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
        document.getElementById("btnProceedCheckout").style.display = "block";
      }
      document.getElementById("cartModal").classList.add("open");
    }

    function removeFromCart(idx) {
      cart.splice(idx, 1);
      updateCartCount();
      openCartModal();
    }

    function closeCartModal() {
      document.getElementById("cartModal").classList.remove("open");
      document.getElementById("checkoutForm").style.display = "none";
    }

    function showCheckoutForm() {
      document.getElementById("checkoutForm").style.display = "block";
      document.getElementById("btnProceedCheckout").style.display = "none";
    }

    async function enviarPedido() {
      const nome = document.getElementById("clientName").value.trim();
      const telefone = document.getElementById("clientPhone").value.trim();
      if (!nome || !telefone) {
        alert("Por favor, preencha pelo menos o Nome e o Telefone.");
        return;
      }

      const total = cart.reduce((sum, i) => sum + i.preco, 0);
      const dadosPedido = {
        nome: nome,
        telefone: telefone,
        cep: document.getElementById("clientCep").value,
        endereco: document.getElementById("clientAddress").value,
        bairro: document.getElementById("clientBairro").value,
        cidade: document.getElementById("clientCity").value,
        itens: JSON.stringify(cart),
        subtotal: total,
        total: total,
        pagamento: "A Combinar",
        entrega: "Entrega Padrão"
      };

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(dadosPedido)
        });
        const result = await res.json();
        if (result.status === "ok") {
          alert("Pedido realizado com sucesso! Nº do pedido: " + result.numeroPedido);
          cart = [];
          updateCartCount();
          closeCartModal();
        } else {
          alert("Erro ao salvar pedido: " + result.mensagem);
        }
      } catch (err) {
        alert("Erro de conexão ao enviar o pedido.");
      }
    }

    init();
  </script>
</body>
</html>
